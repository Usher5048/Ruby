# Builds the latest main branch once per day and publishes a pre-release
# only if the commit has not already been released.
#
# Release tags are based on the commit SHA:
#   nightly-<short_sha>

name: nightly
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: set release metadata
        env:
          BASE_VERSION: 1.0+1.21.11-fabric
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NIGHTLY_VERSION="${BASE_VERSION}-nightly${GITHUB_RUN_NUMBER}"
          RELEASE_TAG="nightly-v${GITHUB_RUN_NUMBER}"
          BUILT_AT="$(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "NIGHTLY_VERSION=${NIGHTLY_VERSION}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          echo "SHORT_SHA=${SHORT_SHA}" >> "${GITHUB_ENV}"
          echo "BUILT_AT=${BUILT_AT}" >> "${GITHUB_ENV}"

      - name: check if release already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists for ${GITHUB_SHA}"
            echo "SKIP_RELEASE=true" >> "${GITHUB_ENV}"
          fi

      - name: build nightly jar
        if: env.SKIP_RELEASE != 'true'
        run: ./gradlew build --no-daemon -Pmod_version="${NIGHTLY_VERSION}"

      - name: resolve release jar
        if: env.SKIP_RELEASE != 'true'
        run: |
          JAR_PATH="$(find build/libs -maxdepth 1 -name 'ruby-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "${JAR_PATH}" ]; then
            echo "No remapped jar found in build/libs"
            exit 1
          fi
          echo "RELEASE_JAR=${JAR_PATH}" >> "${GITHUB_ENV}"

      - name: remove legacy moving nightly release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          if gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Deleting legacy nightly release (moving tag) to stop jar accumulation."
            gh release delete nightly --repo "${{ github.repository }}" --yes --cleanup-tag
          fi

      - name: publish nightly release
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Nightly Build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          fail_on_unmatched_files: true
          body: |
            Automated pre-release from [`main`](${{ github.server_url }}/${{ github.repository }}/tree/main) @ [`${{ env.SHORT_SHA }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).
            > Bleeding-edge build for testing. May be unstable or incomplete.
            
            | **Version** | `${{ env.NIGHTLY_VERSION }}` |
            | --- | --- |
            | **Tag** | `${{ env.RELEASE_TAG }}` |
            | **Built** | ${{ env.BUILT_AT }} |
            | **Trigger** | ${{ github.event_name == 'schedule' && 'Scheduled (06:00 UTC daily)' || 'Manual workflow dispatch' }} |
            | **Workflow run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
            
            [All nightly releases](${{ github.server_url }}/${{ github.repository }}/releases?q=nightly&expanded=true)
          files: ${{ env.RELEASE_JAR }}

      - name: release already exists
        if: env.SKIP_RELEASE == 'true'
        run: |
          echo "Nightly release already exists for commit ${GITHUB_SHA}"