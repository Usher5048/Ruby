plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.0"
    implementation include("io.github.llamalad7:mixinextras-fabric:0.5.0")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    inputs.property 'archivesName', project.base.archivesName

    from('LICENSE') {
        rename { "${it}_${inputs.properties.archivesName}" }
    }

    manifest {
        attributes 'Main-Class': 'ruby.Main'
    }
}

def userHome = System.getenv('USERPROFILE') ?: System.getProperty('user.home')
def localAppData = System.getenv('LOCALAPPDATA') ?: new File(userHome, 'AppData/Local').absolutePath
def qolProfileDir = new File(userHome, 'AppData/Roaming/ModrinthApp/profiles/QoL Profile')
def qolModsDir = new File(qolProfileDir, 'mods')
def modrinthApp = new File(localAppData, 'Modrinth App/Modrinth App.exe')

tasks.register('deployQoL', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into qolModsDir
    doFirst {
        qolModsDir.mkdirs()
        qolModsDir.listFiles()?.findAll { it.name.startsWith('ruby-') && it.name.endsWith('.jar') }?.each { it.delete() }
    }
}

loom {
    runConfigs.configureEach {
        vmArgs '-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'
    }
}

tasks.register('launchModrinth') {
    dependsOn deployQoL
    doLast {
        if (!modrinthApp.isFile()) {
            throw new GradleException("Modrinth App not found at: ${modrinthApp.absolutePath}")
        }
        exec {
            commandLine modrinthApp.absolutePath
        }
    }
}

tasks.register('play') {
    group = 'fabric'
    description = 'Deploy jar to QoL profile and open Modrinth App'
    dependsOn launchModrinth
}

tasks.named('runClient').configure {
    dependsOn deployQoL
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}