
<style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap');
    :root{
      --ruby:#a82938;
      --ruby-hover:#c23344;
      --ruby-soft:rgba(168,41,56,.45);
      --ruby-bg:#0f0c0d;
      --ruby-active:#141012;
      --bg-base:#050405;
      --bg-wrap:#080708;
      --bg-panel:#090809;
      --bg-elevated:#0e0c0d;
      --bg-hover:#121012;
      --border:#181416;
      --border-subtle:#121012;
      --border-panel:rgba(255,255,255,.022);
      --text:#b8b4b5;
      --text-bright:#d4d0d1;
      --text-muted:#5a5557;
      --font-ui:'DM Sans',system-ui,sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;background:var(--bg-base);color:var(--text)}
    .gui-wrap{display:flex;gap:0;padding:24px;background:var(--bg-wrap);min-height:520px;align-items:flex-start;gap:2px;border-radius:12px}
    .panel{background:var(--bg-panel);border-radius:10px;overflow:hidden;width:220px;border:1px solid var(--border-panel);flex-shrink:0}
    .panel-header{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border-subtle)}
    .logo{font-size:17px;font-weight:700;letter-spacing:-.03em;color:var(--ruby)}
    .header-profile{font-size:12px;font-weight:500;color:var(--text-muted);letter-spacing:-.02em;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize}
    .cat-list{padding:6px 0}
    .cat-item{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;transition:background .15s;color:#8a8688;font-size:13px;font-weight:500;position:relative}
    .cat-item:hover,.cat-item.active{background:var(--ruby-bg);color:var(--text-bright)}
    .cat-list>.cat-item:last-child{border-radius:0 0 9px 9px}
    .cat-item.active{color:var(--ruby)}
    .cat-item .ci{width:16px;height:16px;opacity:.7;font-size:15px}
    .cat-item.active .ci{opacity:1;color:var(--ruby)}
    .cat-item .arr{margin-left:auto;font-size:11px;color:#333;flex-shrink:0}
    .cat-item.active .arr{color:var(--ruby)}
    .divider{height:1px;background:var(--border-subtle);margin:4px 0}
    .misc-label{padding:6px 14px 3px;font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase}
    
    .mod-panel{background:var(--bg-panel);border-radius:10px;width:230px;border:1px solid var(--border-panel);overflow:hidden;flex-shrink:0;display:flex;flex-direction:column;transition:opacity .24s cubic-bezier(.32,.72,0,1),transform .24s cubic-bezier(.32,.72,0,1)}
    .mod-panel.cat-out{opacity:0;transform:translateY(6px) scale(.985);pointer-events:none}
    .mod-panel.cat-in{opacity:0;transform:translateY(-6px) scale(.985);pointer-events:none}
    .mod-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--border-subtle);flex-shrink:0}
    .mod-header-left{display:flex;align-items:center;gap:6px;min-width:0}
    .mod-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .38s cubic-bezier(.32,.72,0,1)}
    .mod-panel.collapsed .mod-body{grid-template-rows:0fr}
    .mod-body>.mod-list{overflow:hidden;min-height:0}
    .mod-header span:not(.collapse-btn){font-size:13px;font-weight:600;color:var(--text-bright);letter-spacing:-.01em}
    .mod-header .collapse-btn{color:var(--text-muted);cursor:pointer;font-size:15px;font-weight:400;display:inline-block;line-height:1;padding:4px 6px;margin:-4px -6px;flex-shrink:0;transition:transform .28s cubic-bezier(.32,.72,0,1),color .15s;transform:rotate(90deg)}
    .mod-panel.collapsed .collapse-btn{transform:rotate(-90deg)}
    .mod-header:hover .collapse-btn{color:#7a7577}
    .mod-list{padding:0}
    @keyframes catItemIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .cat-enter{animation:catItemIn .32s cubic-bezier(.32,.72,0,1) both}
    .mod-item{border-bottom:1px solid var(--border-subtle)}
    .mod-item:last-child{border-bottom:none}
    .mod-item:last-child:not(:has(.mod-expand.open))>.mod-row{border-radius:0 0 9px 9px}
    .mod-item:last-child>.mod-expand.open{border-radius:0 0 9px 9px}
    .mod-list-empty{border-radius:0 0 9px 9px}
    .mod-row{display:flex;align-items:center;padding:9px 14px;cursor:pointer;transition:background .28s cubic-bezier(.32,.72,0,1)}
    .mod-row:hover{background:var(--bg-hover)}
    .mod-name{flex:1;font-size:13px;font-weight:500;color:var(--text);letter-spacing:-.01em}
    .mod-dots{color:#333;font-size:16px;letter-spacing:2px;cursor:pointer;padding:0 2px}
    .mod-dots:hover{color:#666}
    .mod-expand{display:grid;grid-template-rows:0fr;background:var(--bg-base);padding:0 14px;overflow:hidden;transition:grid-template-rows .38s cubic-bezier(.32,.72,0,1),padding .38s cubic-bezier(.32,.72,0,1)}
    .mod-expand.open{grid-template-rows:1fr;padding:8px 14px 10px}
    .mod-expand-inner{overflow:hidden;min-height:0}
    .setting-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
    .setting-label{font-size:12px;color:#6a6567;font-weight:500}
    .toggle{width:32px;height:16px;background:#1a1617;border-radius:8px;position:relative;cursor:pointer;transition:background .28s cubic-bezier(.32,.72,0,1);flex-shrink:0}
    .toggle.on{background:var(--ruby)}
    .toggle::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:6px;background:#ccc;transition:left .28s cubic-bezier(.32,.72,0,1)}
    .toggle.on::after{left:18px;background:#e8e4e5}
    .slider-wrap{padding:4px 0}
    .slider-label{display:flex;justify-content:space-between;margin-bottom:4px}
    .slider-label span:first-child{font-size:12px;color:#6a6567;font-weight:500}
    .slider-label span:last-child{font-size:12px;color:var(--ruby);font-family:var(--font-mono);font-weight:500}
    input[type=range]{width:100%;height:4px;-webkit-appearance:none;background:#1a1617;border-radius:2px;outline:none;cursor:pointer}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:6px;background:var(--ruby);cursor:pointer}
    .enum-wrap{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
    .enum-val{font-size:12px;background:var(--bg-hover);color:var(--ruby);border:1px solid var(--border);border-radius:4px;padding:2px 8px;cursor:pointer;font-family:var(--font-mono);font-weight:500}
    .enum-val:hover{background:var(--ruby-active)}
    .keybind-badge{font-size:10px;background:var(--bg-hover);border:1px solid var(--border);color:var(--text-muted);border-radius:4px;padding:1px 6px;margin-left:auto;margin-right:8px;font-weight:500}
    .special-panel{padding:0}
    .special-row{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;transition:background .2s cubic-bezier(.32,.72,0,1);border-bottom:1px solid var(--border-subtle)}
    .special-row:last-child{border-bottom:none}
    .special-row:hover{background:var(--bg-hover)}
    .special-row.active{background:var(--ruby-active);color:var(--ruby)}
    .special-row.active .special-name{color:var(--ruby)}
    .special-name{flex:1;font-size:13px;font-weight:500;color:var(--text);letter-spacing:-.01em}
    .special-action{font-size:11px;color:var(--text-muted);cursor:pointer;padding:2px 6px;border-radius:4px;transition:color .15s,background .15s;flex-shrink:0}
    .special-action:hover{color:#c25555;background:#120c0c}
    .special-action.add{color:var(--ruby)}
    .special-action.add:hover{color:var(--text-bright);background:var(--ruby-bg)}
    .add-row{padding:8px 14px;border-bottom:1px solid var(--border-subtle);display:flex;gap:8px;align-items:center}
    .add-row input{flex:1;background:var(--bg-base);border:1px solid var(--border);border-radius:4px;padding:6px 8px;font-size:12px;font-family:var(--font-ui);color:var(--text);outline:none;transition:border-color .2s}
    .add-row input:focus{border-color:var(--ruby)}
    .add-row button{background:var(--ruby);border:none;border-radius:4px;color:#e8e4e5;font-size:11px;font-weight:600;font-family:var(--font-ui);padding:6px 10px;cursor:pointer;transition:background .15s}
    .add-row button:hover{background:var(--ruby-hover)}
    .friend-head{width:24px;height:24px;border-radius:4px;image-rendering:pixelated;flex-shrink:0;background:var(--bg-hover)}
    .profile-dot{width:6px;height:6px;border-radius:50%;background:#282426;flex-shrink:0}
    .special-row.active .profile-dot{background:var(--ruby)}
    .special-panel>.special-row:last-child,.special-panel>.add-row:last-child,.special-panel>.add-btn-row:last-child,.special-panel>.save-profile-row:last-child,.special-panel>.mod-list-empty:last-child{border-radius:0 0 9px 9px}
    .add-btn-row{padding:10px 14px}
    .add-btn-row .special-action.add{font-size:12px;padding:6px 10px;border:1px dashed var(--border);width:100%;text-align:center;display:block}
    .add-btn-row .special-action.add:hover{border-color:var(--ruby)}
    .save-profile-row{padding:10px 14px;border-top:1px solid var(--border-subtle)}
    .save-profile-btn{width:100%;background:var(--ruby);border:none;border-radius:4px;color:#e8e4e5;font-size:12px;font-weight:600;font-family:var(--font-ui);padding:8px 10px;cursor:pointer;transition:background .2s,opacity .2s}
    .save-profile-btn:hover{background:var(--ruby-hover)}
    .save-profile-btn.saved{background:#1a1617;color:var(--ruby);opacity:.9}
    </style>
    
    <h2 class="sr-only">Ruby client ClickGUI mockup with module categories, module list, and expandable settings.</h2>
    
    <div class="gui-wrap">
      <div class="panel">
        <div class="panel-header">
          <div class="logo">Ruby</div>
          <span class="header-profile" id="active-profile-badge">default</span>
        </div>
        <div class="cat-list">
          <div class="cat-item active" onclick="selectCat(this,'Combat')">
            <i class="ti ti-sword cat-ci" aria-hidden="true"></i> Combat
            <span class="arr">›</span>
          </div>
          <div class="cat-item" onclick="selectCat(this,'Render')">
            <i class="ti ti-eye cat-ci" aria-hidden="true"></i> Render
            <span class="arr">›</span>
          </div>
          <div class="cat-item" onclick="selectCat(this,'Utility')">
            <i class="ti ti-tool cat-ci" aria-hidden="true"></i> Utility
            <span class="arr">›</span>
          </div>
          <div class="cat-item" onclick="selectCat(this,'World')">
            <i class="ti ti-world cat-ci" aria-hidden="true"></i> World
            <span class="arr">›</span>
          </div>
          <div class="cat-item" onclick="selectCat(this,'Inventory')">
            <i class="ti ti-briefcase cat-ci" aria-hidden="true"></i> Inventory
            <span class="arr">›</span>
          </div>
          <div class="cat-item" onclick="selectCat(this,'Minigames')">
            <i class="ti ti-device-gamepad-2 cat-ci" aria-hidden="true"></i> Minigames
            <span class="arr">›</span>
          </div>
          <div class="cat-item" onclick="selectCat(this,'Other')">
            <i class="ti ti-dots cat-ci" aria-hidden="true"></i> Other
            <span class="arr">›</span>
          </div>
          <div class="divider"></div>
          <div class="misc-label">Misc</div>
          <div class="cat-item" onclick="selectCat(this,'Friends')">Friends <span class="arr">›</span></div>
          <div class="cat-item" onclick="selectCat(this,'Profiles')">Profiles <span class="arr">›</span></div>
        </div>
      </div>
    
      <div class="mod-panel" id="mod-panel">
        <div class="mod-header">
          <div class="mod-header-left">
            <i class="ti ti-sword" style="font-size:14px;color:#a82938;flex-shrink:0" aria-hidden="true"></i>
            <span id="cat-title">Combat</span>
          </div>
          <span class="collapse-btn" onclick="togglePanel()" id="panel-collapse-btn">›</span>
        </div>
        <div class="mod-body">
          <div class="mod-list" id="mod-list"></div>
        </div>
      </div>
    </div>
    
    <script>
    const cats = {
      Combat: [
        {name:'AimAssist', settings:[
          {type:'slider',label:'Range',min:1,max:6,step:0.1,val:3.5},
          {type:'slider',label:'FOV',min:30,max:360,step:1,val:90},
          {type:'toggle',label:'Only when holding rod',val:false},
          {type:'enum',label:'Target',opts:['Players','Mobs','All'],val:0},
        ]},
        {name:'AutoClicker', settings:[
          {type:'slider',label:'Min CPS',min:1,max:20,step:1,val:10},
          {type:'slider',label:'Max CPS',min:1,max:20,step:1,val:14},
          {type:'toggle',label:'RMB only',val:false},
        ]},
        {name:'BlockHit', settings:[
          {type:'toggle',label:'Only sprint',val:true},
        ]},
        {name:'HitSelect', settings:[
          {type:'enum',label:'Mode',opts:['Switch','Normal'],val:0},
          {type:'slider',label:'Delay',min:0,max:500,step:10,val:100},
        ]},
        {name:'Reach', settings:[
          {type:'slider',label:'Reach',min:3,max:6,step:0.1,val:3.2},
          {type:'toggle',label:'Only in PvP',val:false},
        ]},
        {name:'RightClicker', settings:[
          {type:'slider',label:'CPS',min:1,max:20,step:1,val:12},
        ]},
        {name:'SilentAura', settings:[
          {type:'slider',label:'Range',min:1,max:6,step:0.1,val:4.0},
          {type:'toggle',label:'Smooth rotate',val:true},
          {type:'enum',label:'Sort',opts:['Distance','Health','Angle'],val:0},
        ]},
        {name:'Sprint', settings:[
          {type:'enum',label:'Mode',opts:['Legit','Multi','Strafe'],val:0},
        ]},
        {name:'Velocity', settings:[
          {type:'slider',label:'H reduce',min:0,max:100,step:1,val:80},
          {type:'slider',label:'V reduce',min:0,max:100,step:1,val:100},
          {type:'toggle',label:'Verus bypass',val:false},
        ]},
        {name:'WTap', settings:[
          {type:'toggle',label:'Smart WTap',val:true},
        ]},
      ],
      Render: [
        {name:'ESP', settings:[{type:'toggle',label:'Box',val:true},{type:'toggle',label:'Health bar',val:true},{type:'enum',label:'Mode',opts:['2D','3D'],val:0}]},
        {name:'Fullbright', settings:[{type:'slider',label:'Gamma',min:1,max:10,step:0.5,val:5}]},
        {name:'Tracers', settings:[{type:'toggle',label:'Enabled',val:false}]},
      ],
      Utility: [
        {name:'Timer', settings:[{type:'slider',label:'Speed',min:0.1,max:5,step:0.1,val:1.0}]},
        {name:'AutoRespawn', settings:[{type:'toggle',label:'Chat notify',val:false}]},
      ],
      World: [
        {name:'FastBreak', settings:[{type:'slider',label:'Speed',min:1,max:10,step:1,val:5}]},
      ],
      Inventory:[
        {name:'ChestStealer',settings:[{type:'slider',label:'Delay',min:0,max:500,step:10,val:100}]},
      ],
      Minigames:[
        {name:'BedBreaker',settings:[{type:'toggle',label:'Only at bed',val:true}]},
      ],
      Other:[
        {name:'AntiBot',settings:[{type:'toggle',label:'Grim mode',val:false}]},
      ],
    };

    const CAT_ICONS = {
      Combat:'ti-sword', Render:'ti-eye', Utility:'ti-tool', World:'ti-world',
      Inventory:'ti-briefcase', Minigames:'ti-device-gamepad-2', Other:'ti-dots',
      Friends:'ti-users', Profiles:'ti-user-circle'
    };

    let profiles = ['default', 'hypixel', 'uhc', 'minigames'];
    let activeProfile = 'default';
    let friends = ['Notch', 'jeb_'];
    let addingFriend = false;
    
    const ACCENT = '#a82938';
    const TRACK = '#1a1617';
    const KEYS = ['NONE','Q','E','R','T','Y','U','I','O','P','Z','X','C','V','B','N','M'];
    function randKey(){return KEYS[Math.floor(Math.random()*KEYS.length)]}
    
    let currentCat = 'Combat';
    let openMod = null;
    let panelOpen = true;
    
    function updateProfileBadge(){
      const badge = document.getElementById('active-profile-badge');
      if(badge) badge.textContent = activeProfile;
    }

    let catSwitching = false;
    const CAT_OUT_MS = 240;
    const CAT_PAUSE_MS = 80;

    function animateCategorySwitch(callback){
      const panel = document.getElementById('mod-panel');
      if(!panel){ callback(); return; }
      catSwitching = true;
      panel.classList.remove('cat-in');
      panel.classList.add('cat-out');
      setTimeout(() => {
        callback();
        panel.classList.remove('cat-out');
        panel.classList.add('cat-in');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            panel.classList.remove('cat-in');
            catSwitching = false;
          });
        });
      }, CAT_OUT_MS + CAT_PAUSE_MS);
    }

    function markEnter(el, i){
      el.classList.add('cat-enter');
      el.style.animationDelay = (i * 32) + 'ms';
    }

    function selectCat(el, cat){
      if(cat === currentCat || catSwitching) return;
      document.querySelectorAll('.cat-item').forEach(e=>e.classList.remove('active'));
      el.classList.add('active');
      if(cat !== 'Friends') addingFriend = false;
      animateCategorySwitch(() => {
        currentCat = cat;
        openMod = null;
        renderModPanel(true);
      });
    }

    function togglePanel(){
      panelOpen = !panelOpen;
      document.getElementById('mod-panel').classList.toggle('collapsed', !panelOpen);
    }

    function renderModPanel(animate){
      const title = document.getElementById('cat-title');
      const headerIcon = document.querySelector('.mod-header-left i');
      title.textContent = currentCat;
      if(headerIcon){
        headerIcon.className = 'ti ' + (CAT_ICONS[currentCat] || 'ti-dots');
        headerIcon.style.cssText = 'font-size:14px;color:' + ACCENT + ';flex-shrink:0';
      }

      const list = document.getElementById('mod-list');
      list.innerHTML = '';
      list.className = 'mod-list';
      let enterIdx = 0;

      if(currentCat === 'Friends'){
        list.className = 'mod-list special-panel';
        renderFriendsPanel(list, animate, () => enterIdx++);
        return;
      }
      if(currentCat === 'Profiles'){
        list.className = 'mod-list special-panel';
        renderProfilesPanel(list, animate, () => enterIdx++);
        return;
      }

      const mods = cats[currentCat] || [];
      if(mods.length === 0){
        const empty = document.createElement('div');
        empty.className = 'mod-list-empty';
        empty.style.cssText = 'padding:16px 14px;font-size:12px;color:#5a5557';
        empty.textContent = 'No modules';
        list.appendChild(empty);
        if(animate) markEnter(empty, 0);
        return;
      }
      mods.forEach((mod, i) => {
        const key = randKey();
        const item = document.createElement('div');
        item.className = 'mod-item';
        item.innerHTML = `
          <div class="mod-row" onclick="toggleMod(${i})">
            <span class="mod-name" id="modname-${i}">${mod.name}</span>
            <span class="keybind-badge">${key}</span>
            <span class="mod-dots" title="options">⋮</span>
          </div>
          <div class="mod-expand" id="expand-${i}"><div class="mod-expand-inner"></div></div>
        `;
        list.appendChild(item);
        if(animate) markEnter(item, i);
        if(mod.settings && mod.settings.length > 0){
          renderSettings(i, mod);
        }
      });
    }

    function playerHeadUrl(name){
      return 'https://minotar.net/avatar/' + encodeURIComponent(name) + '/24';
    }

    function renderFriendsPanel(list, animate, nextIdx){
      const idx = () => animate ? nextIdx() : 0;
      if(addingFriend){
        const form = document.createElement('div');
        form.className = 'add-row';
        form.innerHTML = `
          <input type="text" id="friend-input" placeholder="Username..." maxlength="16" autocomplete="off">
          <button type="button" onclick="submitFriend()">Add</button>
        `;
        list.appendChild(form);
        if(animate) markEnter(form, idx());
        const input = form.querySelector('#friend-input');
        input.focus();
        input.addEventListener('keydown', e => {
          if(e.key === 'Enter') submitFriend();
          if(e.key === 'Escape'){ addingFriend = false; renderModPanel(); }
        });
      } else {
        const addRow = document.createElement('div');
        addRow.className = 'add-btn-row';
        addRow.innerHTML = '<span class="special-action add" onclick="startAddFriend()">+ Add Friend</span>';
        list.appendChild(addRow);
        if(animate) markEnter(addRow, idx());
      }

      if(friends.length === 0 && !addingFriend){
        const empty = document.createElement('div');
        empty.className = 'mod-list-empty';
        empty.style.cssText = 'padding:16px 14px;font-size:12px;color:#5a5557';
        empty.textContent = 'No friends added';
        list.appendChild(empty);
        if(animate) markEnter(empty, idx());
        return;
      }

      friends.forEach((name, fi) => {
        const row = document.createElement('div');
        row.className = 'special-row';
        row.innerHTML = `
          <img class="friend-head" src="${playerHeadUrl(name)}" alt="" width="24" height="24" onerror="this.src='https://minotar.net/avatar/Steve/24'">
          <span class="special-name">${name}</span>
          <span class="special-action" onclick="removeFriend(${fi}, event)" title="Remove">✕</span>
        `;
        list.appendChild(row);
        if(animate) markEnter(row, idx());
      });
    }

    function startAddFriend(){
      addingFriend = true;
      renderModPanel();
    }

    function submitFriend(){
      const input = document.getElementById('friend-input');
      if(!input) return;
      const name = input.value.trim();
      if(!name) return;
      if(!friends.some(f => f.toLowerCase() === name.toLowerCase())){
        friends.push(name);
      }
      addingFriend = false;
      renderModPanel();
    }

    function removeFriend(i, e){
      e.stopPropagation();
      friends.splice(i, 1);
      renderModPanel();
    }

    function renderProfilesPanel(list, animate, nextIdx){
      profiles.forEach((name, i) => {
        const row = document.createElement('div');
        row.className = 'special-row' + (name === activeProfile ? ' active' : '');
        row.onclick = () => selectProfile(name);
        row.innerHTML = `
          <span class="profile-dot"></span>
          <span class="special-name">${name}</span>
          ${name !== 'default' ? `<span class="special-action" onclick="removeProfile(${i}, event)" title="Remove">✕</span>` : ''}
        `;
        list.appendChild(row);
        if(animate) markEnter(row, nextIdx());
      });

      const saveRow = document.createElement('div');
      saveRow.className = 'save-profile-row';
      saveRow.innerHTML = '<button type="button" class="save-profile-btn" id="save-profile-btn" onclick="saveProfile()">Save Profile</button>';
      list.appendChild(saveRow);
      if(animate) markEnter(saveRow, nextIdx());
    }

    function saveProfile(){
      const btn = document.getElementById('save-profile-btn');
      if(!btn || btn.classList.contains('saved')) return;
      btn.textContent = 'Saved!';
      btn.classList.add('saved');
      setTimeout(() => {
        btn.textContent = 'Save Profile';
        btn.classList.remove('saved');
      }, 1600);
    }

    function selectProfile(name){
      activeProfile = name;
      updateProfileBadge();
      renderModPanel();
    }

    function removeProfile(i, e){
      e.stopPropagation();
      const removed = profiles[i];
      if(removed === 'default') return;
      profiles.splice(i, 1);
      if(activeProfile === removed){
        activeProfile = profiles[0] || 'default';
        updateProfileBadge();
      }
      renderModPanel();
    }
    
    function renderSettings(i, mod){
      const exp = document.getElementById('expand-'+i);
      if(!exp) return;
      const inner = exp.querySelector('.mod-expand-inner') || exp;
      inner.innerHTML = '';
      mod.settings.forEach((s,si) => {
        const row = document.createElement('div');
        if(s.type === 'toggle'){
          row.className = 'setting-row';
          row.innerHTML = `<span class="setting-label">${s.label}</span>
            <div class="toggle${s.val?' on':''}" onclick="flipToggle(${i},${si},this)"></div>`;
        } else if(s.type === 'slider'){
          row.className = 'slider-wrap';
          const pct = (s.val - s.min)/(s.max - s.min)*100;
          row.innerHTML = `<div class="slider-label"><span>${s.label}</span><span id="sv-${i}-${si}">${s.val}</span></div>
            <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.val}"
              style="background:linear-gradient(to right,${ACCENT} ${pct}%,${TRACK} ${pct}%)"
              oninput="updateSlider(this,${i},${si})">`;
        } else if(s.type === 'enum'){
          row.className = 'enum-wrap';
          row.innerHTML = `<span class="setting-label">${s.label}</span>
            <span class="enum-val" id="ev-${i}-${si}" onclick="cycleEnum(${i},${si})">${s.opts[s.val]}</span>`;
        }
        inner.appendChild(row);
      });
    }
    
    function flipToggle(mi, si, el){
      const mod = (cats[currentCat]||[])[mi];
      if(!mod) return;
      mod.settings[si].val = !mod.settings[si].val;
      el.classList.toggle('on', mod.settings[si].val);
    }
    
    function updateSlider(el, mi, si){
      const mod = (cats[currentCat]||[])[mi];
      if(!mod) return;
      const v = parseFloat(el.value);
      mod.settings[si].val = v;
      const label = document.getElementById('sv-'+mi+'-'+si);
      if(label) label.textContent = (mod.settings[si].step < 1) ? v.toFixed(1) : v;
      const pct = (v - mod.settings[si].min)/(mod.settings[si].max - mod.settings[si].min)*100;
      el.style.background = `linear-gradient(to right,${ACCENT} ${pct}%,${TRACK} ${pct}%)`;
    }
    
    function cycleEnum(mi, si){
      const mod = (cats[currentCat]||[])[mi];
      if(!mod) return;
      const s = mod.settings[si];
      s.val = (s.val + 1) % s.opts.length;
      const el = document.getElementById('ev-'+mi+'-'+si);
      if(el) el.textContent = s.opts[s.val];
    }
    
    function toggleMod(i){
      const exp = document.getElementById('expand-'+i);
      if(!exp) return;
      const isOpen = exp.classList.contains('open');
      document.querySelectorAll('.mod-expand.open').forEach(e=>{
        e.classList.remove('open');
      });
      if(!isOpen) exp.classList.add('open');
    }

    updateProfileBadge();
    renderModPanel();
    </script>
